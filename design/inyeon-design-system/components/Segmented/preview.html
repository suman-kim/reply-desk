<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Segmented</title></head>
<body>
<div id="root" class="iy-preview"></div>
<script>
var I = window.Inyeon, h = React.createElement;
function Demo() {
  var s = React.useState('auto');
  return h(I.Segmented, { label: '게시할 계정', value: s[0], onChange: s[1], options: [{ value: 'y1', label: '유튜브1' }, { value: 'y2', label: '유튜브2' }, { value: 'y3', label: '유튜브3' }, { value: 'auto', label: '자동 배정' }] });
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
